[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyagentic"
version = "0.1.0"
description = "Pure-Python, engine-agnostic essence of Agentic-Flink (the portable core that the Faust/Ray/Dask/Airflow ports build on)"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# PyYAML is needed by tests/test_cep_weave.py, which drives the sibling
# agentic-pipeline YAML loader. The library itself still has no runtime deps.
test = ["pytest>=7", "PyYAML>=6"]

[tool.setuptools.packages.find]
include = ["pyagentic*"]
